function makeSprite(lines){let wi=Math.max(...lines.map(x=>x.length));let cv=document.createElement('canvas');cv.width=wi;cv.height=lines.length;let cx=cv.getContext('2d');lines.forEach((r,y)=>[...r.padEnd(wi,'.')].forEach((k,x)=>{if(pal[k]){cx.fillStyle=pal[k];cx.fillRect(x,y,1,1)}}));return cv;}
const sprites=Object.fromEntries(Object.entries(spriteRows).map(([k,v])=>[k,makeSprite(v)]));
const stars=Array.from({length:170},()=>({x:rand(0,W),y:rand(0,H),v:rand(.2,1.35),r:Math.random()<.13?2:1,t:rand(0,TAU)}));
const keys=new Set(), pointer={down:false,x:240,y:235},touch={left:false,right:false,up:false,down:false,fire:false},buttons=[];

const s={mode:'menu',stage:0,player:null,enemies:[],shots:[],hostile:[],pickups:[],particles:[],effects:[],tick:0,stageTime:0,spawn:0,kills:0,bossShown:false,shake:0,score:0,combo:0,comboTime:0,overlayTimer:0,select:0,fireHeld:false,audio:false};

function start(){s.audio=true;s.how=false;s.score=0;s.stage=0;s.player={x:240,y:245,r:8,hp:5,maxHp:5,weapon:1,fireRate:1,speed:1,power:1,inv:1.8,dash:0,dashCooldown:0,shield:0,shotCd:0};initStage(0)}

function spawnParticle(x,y,color,n=9,force=1){for(let k=0;k<n;k++){let ang=rand(0,TAU),speed=rand(14,85)*force;s.particles.push({x,y,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,life:rand(.18,.68),max:.68,col:color,r:Math.random()<.16?2:1})}if(s.particles.length>380)s.particles.splice(0,s.particles.length-380);}

function createEnemy(type,x,y){const data={dr:[4,12,38,3],str:[3,11,59,2],tur:[8,13,24,5],rock:[4,12,47,2]}[type];s.enemies.push({type,x,y,hp:data[0]+Math.floor(s.stage*.9),maxHp:data[0]+Math.floor(s.stage*.9),r:data[1],speed:data[2]+s.stage*4,value:data[3]*20,age:0,fire:rand(1.2,2.7),phase:rand(0,TAU),vx:rand(-13,13)})}
function spawnWave(){if(s.enemies.length>=7||s.bossShown)return;let x=rand(35,445),v=Math.random();const type=s.stage===0?(v<.67?'dr':'str'):s.stage===1?(v<.28?'rock':v<.65?'dr':'str'):(v<.2?'rock':v<.48?'str':v<.76?'dr':'tur');createEnemy(type,x,-25);if(s.stage>=3&&Math.random()<.18&&s.enemies.length<6)createEnemy('str',clamp(x+rand(-64,64),24,456),-45)}

function shoot(){const p=s.player,typ=p.weapon;let angles=typ>=3?[-.2,0,.2]:typ===2?[-.12,.12]:[0];if(typ>=4)angles=[-.3,-.15,0,.15,.3];angles.forEach(a=>{s.shots.push({x:p.x+Math.sin(a)*7,y:p.y-11,vx:Math.sin(a)*175,vy:-210*Math.cos(a),r:typ>=4?3:2,damage:p.power+(typ>=5?1:0),pierce:typ>=5?1:0,col:Math.abs(a)<.02?'#b5ffff':'#ffe397'})});spawnParticle(p.x,p.y-13,'#70eaf8',3,.25);sound(520,.045,'square',.014,-240)}
function enemyBullet(x,y,angle,speed=78,color='#ff9b58',radius=3){s.hostile.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,r:radius,col:color})}
function aimAt(x,y){const p=s.player;return Math.atan2(p.y-y,p.x-x)}
function fireEnemy(e){if(e.type==='dr'){enemyBullet(e.x,e.y+11,aimAt(e.x,e.y),81+s.stage*5)}else if(e.type==='tur'){for(let a of [-.2,0,.2])enemyBullet(e.x,e.y+13,aimAt(e.x,e.y)+a,70+s.stage*4,'#ed9af9')}else if(e.type==='str'){enemyBullet(e.x,e.y+9,PI/2,109+s.stage*3,'#ffcc75',2)}else if(e.type==='boss'){
 let a=aimAt(e.x,e.y+12),mode=(Math.floor(e.age/2.6)+s.stage)%3;
 if(mode===0)for(let j=-2;j<=2;j++)enemyBullet(e.x+j*12,e.y+23,a+j*.22,88+s.stage*4,'#ffa361',3);
 if(mode===1)for(let k=0;k<12;k++)enemyBullet(e.x,e.y+15,k*TAU/12+e.age*.3,68+s.stage*5,'#bd9afc',3);
 if(mode===2)for(let j=-3;j<=3;j++)enemyBullet(e.x+j*11,e.y+22,PI/2+(j*.095),107+s.stage*3,'#fd7479',3);
 sound(140,.14,'sawtooth',.018,-42)
}}
function hurt(n=1){let p=s.player;if(!p||p.inv>0||p.dash>0||p.shield>0)return;p.hp-=n;p.inv=1.65;s.shake=9;spawnParticle(p.x,p.y,'#ff6f7d',24,1.3);sound(128,.28,'sawtooth',.06,-90);if(p.hp<=0){p.hp=0;s.mode='over';record();}}
function record(){high=Math.max(high,s.score);try{localStorage.setItem('starstrike_high',String(high));localStorage.setItem('starstrike_unlocked',String(Math.max(levelClear,s.stage)))}catch{}}
function killEnemy(e){const idx=s.enemies.indexOf(e);if(idx<0)return;s.enemies.splice(idx,1);spawnParticle(e.x,e.y,e.type==='boss'?'#fbbe68':'#f09b6d',e.type==='boss'?120:17,e.type==='boss'?1.65:.8);fx(e.x,e.y,e.type==='boss'?50:13,'#ffad63');s.shake=e.type==='boss'?16:3;s.score+=e.value;s.combo++;s.comboTime=3;if(e.type==='boss'){s.hostile=[];sound(170,.45,'triangle',.09,500);record();if(s.stage===4){s.mode='win';levelClear=5;record()}else{s.mode='upgrade';s.select=0;s.player.hp=Math.min(s.player.maxHp,s.player.hp+1);levelClear=Math.max(levelClear,s.stage+1);record()}}else{s.kills++;if(Math.random()<.25)reward(e.x,e.y);sound(120,.13,'triangle',.03,-60)}}
function collect(p){let idx=s.pickups.indexOf(p);if(idx<0)return;s.pickups.splice(idx,1);if(p.type==='weapon')s.player.weapon=Math.min(5,s.player.weapon+1);if(p.type==='heal')s.player.hp=Math.min(s.player.maxHp,s.player.hp+1);if(p.type==='shield')s.player.shield=5;spawnParticle(p.x,p.y,'#e8fa98',21,.8);s.score+=75;sound(550,.16,'triangle',.05,320)}
function upgrade(i){if(s.mode!=='upgrade')return;let p=s.player;if(i===0){p.weapon=Math.min(5,p.weapon+1);p.power+=.3}else if(i===1){p.maxHp=Math.min(9,p.maxHp+1);p.hp=Math.min(p.maxHp,p.hp+2)}else{p.fireRate=Math.min(2.5,p.fireRate+.28);p.speed=Math.min(1.6,p.speed+.13)}sound(530,.19,'triangle',.05,230);initStage(s.stage+1)}
function dash(){let p=s.player;if(!p||s.mode!=='play'||p.dashCooldown>0)return;p.dash=.5;p.dashCooldown=8.5;p.inv=Math.max(p.inv,.6);s.shake=2;spawnParticle(p.x,p.y,'#86eafd',26,.85);s.hostile=s.hostile.filter(b=>Math.hypot(b.x-p.x,b.y-p.y)>38);sound(210,.3,'sawtooth',.045,420)}
function isDown(...a){return a.some(k=>keys.has(k))}
function moveInput(){let dx=0,dy=0;if(isDown('ArrowLeft','KeyA')||touch.left)dx--;if(isDown('ArrowRight','KeyD')||touch.right)dx++;if(isDown('ArrowUp','KeyW')||touch.up)dy--;if(isDown('ArrowDown','KeyS')||touch.down)dy++;return{dx,dy}}
function update(dt){s.tick+=dt;const sp=stages[s.stage];for(const star of stars){star.y+=star.v*(s.mode==='play'?16:8)*dt;if(star.y>H){star.y=0;star.x=rand(0,W)}}
 s.shake=Math.max(0,s.shake-33*dt);
 for(const a of s.particles){a.x+=a.vx*dt;a.y+=a.vy*dt;a.vx*=.985;a.vy*=.985;a.life-=dt} s.particles=s.particles.filter(o=>o.life>0);
 s.effects.forEach(x=>x.life-=dt);s.effects=s.effects.filter(x=>x.life>0);
 if(s.mode!=='play')return;
 s.stageTime+=dt;s.overlayTimer=Math.max(0,s.overlayTimer-dt);
 const p=s.player;p.inv=Math.max(0,p.inv-dt);p.dash=Math.max(0,p.dash-dt);p.dashCooldown=Math.max(0,p.dashCooldown-dt);p.shield=Math.max(0,p.shield-dt);
 let {dx,dy}=moveInput();let len=Math.hypot(dx,dy)||1;let speed=137*p.speed*(p.dash>0?2:1);p.x=clamp(p.x+dx/len*speed*dt,15,W-15);p.y=clamp(p.y+dy/len*speed*dt,TOP+16,BOTTOM-13);
 if((dx||dy||p.dash>0)&&Math.random()<.55)spawnParticle(p.x+rand(-3,3),p.y+10,'#63d7ff',1,.22);
 p.shotCd-=dt;if(p.shotCd<=0){shoot();p.shotCd=.25/p.fireRate*(p.weapon>=4?.86:1)}
 s.spawn-=dt;if(!s.bossShown&&s.kills<sp.quota&&s.spawn<=0){spawnWave();s.spawn=Math.max(.46,1.04-s.stage*.11)*rand(.8,1.3)}
 for(const e of s.enemies){e.age+=dt;e.fire-=dt;
 if(e.type==='boss'){if(e.enter){e.y+=e.speed*dt;if(e.y>=67){e.y=67;e.enter=false}}else{e.x=240+Math.sin(e.age*.65)*116;e.y=64+Math.sin(e.age*.8)*9}if(!e.enter&&e.fire<=0){fireEnemy(e);e.fire=Math.max(.64,1.3-s.stage*.1)}}
 else{e.y+=e.speed*dt;e.x+=Math.sin(e.age*(e.type==='str'?5:2)+e.phase)*(e.type==='str'?34:14)*dt;if(e.fire<=0&&e.y>TOP&&e.y<BOTTOM-35){fireEnemy(e);e.fire=rand(1.4,2.6)}if(e.y>H+24){e.hp=0;e.escaped=true}}
 }
 for(const e of [...s.enemies])if(e.escaped){s.enemies.splice(s.enemies.indexOf(e),1)}
 for(let i=s.shots.length-1;i>=0;i--){let b=s.shots[i];b.x+=b.vx*dt;b.y+=b.vy*dt;let gone=b.y<19||b.x<0||b.x>W;for(const e of [...s.enemies]){if(!b.hit)b.hit=new Set();if(!gone&&!b.hit.has(e)&&!(e.type==='boss'&&e.enter)&&Math.abs(b.x-e.x)<e.r+4&&Math.abs(b.y-e.y)<(e.type==='boss'?25:11)+4){b.hit.add(e);e.hp-=b.damage;spawnParticle(b.x,b.y,'#fae3a5',3,.35);if(e.hp<=0)killEnemy(e);if(b.pierce>0)b.pierce--;else gone=true}}if(gone)s.shots.splice(i,1)}
 for(let i=s.hostile.length-1;i>=0;i--){let b=s.hostile[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<-15||b.x>W+15||b.y<-15||b.y>H+15){s.hostile.splice(i,1);continue}if(Math.hypot(b.x-p.x,b.y-p.y)<(b.r+p.r-1)){s.hostile.splice(i,1);hurt()}}
 for(const e of s.enemies)if(!e.escaped&&Math.hypot(e.x-p.x,e.y-p.y)<(e.r+p.r-4))hurt();

function text(t,x,y,size=10,color='#dcecff',align='left',shadow=false){g.save();g.font=`bold ${size}px Consolas,'Microsoft Yahei',monospace`;g.textAlign=align;g.textBaseline='top';if(shadow){g.shadowBlur=9;g.shadowColor=color}g.fillStyle='#040814';g.fillText(t,x+1,y+2);g.fillStyle=color;g.fillText(t,x,y);g.restore()}

function meteorArt(x,y,scale=1,rot=0){
 g.save();g.translate(Math.round(x),Math.round(y));g.rotate(rot);g.scale(scale,scale);
 // Hand-drawn pixel fire trail; oriented toward the top-right of the meteor.
 for(let k=0;k<30;k++){let xx=12+k*2,yy=-8-k*.63;let flare=Math.sin(k*1.97)*2;
  g.fillStyle=k%4===0?'#d94356':k%3===0?'#f16c45':'#f9aa58';

  if(k%3===0){g.fillStyle='#ffe58b';g.fillRect(Math.round(xx-2),Math.round(yy+3+flare),4,2)}
 }
 for(let py=-16;py<=16;py+=2)for(let px=-16;px<=16;px+=2){let d=Math.hypot(px,py),perturb=Math.sin(px*.7+py*.43)*1.9;if(d<15+perturb){

   if((px*7+py*13)%17===0&&d<12)g.fillStyle='#7e3654';g.fillRect(px,py,2,2)
 }}
 g.fillStyle='#7d3548';g.fillRect(-7,-2,3,3);g.fillRect(3,5,3,2);
 g.restore();
}
function bossArt(x,y,scale=1,time=0,variant=0){g.save();g.translate(Math.round(x),Math.round(y));g.scale(scale,scale);
 // detailed broad retro pixel capital ship, mechanically symmetric, 82x48
 const accent=['#56c6ec','#f38f54','#b589fb','#6df1c5','#f77087'][variant],glint=['#b8f9ff','#ffd6a4','#eed3ff','#c3fff1','#ffb7c8'][variant];
 glow(0,0,43,accent,.27);
